<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cape of No Hope</title>
<script>
/* Old links like ?stop=pump still work: send them to the stop's folder */
var STOP = new URLSearchParams(location.search).get("stop");
if(STOP === "pump" || STOP === "mannenberg") location.replace(STOP + "/");
</script>
<style>
:root{--void:#050303;--bone:#f2e6d2;--red:#a8070e;--ink:#140203;--ember:#ff5a3c;color-scheme:dark}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--bone);font-family:"Palatino Linotype",Georgia,serif}
main{max-width:26rem;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{color:var(--ember);font-size:15px;letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font-size:44px;line-height:1;font-weight:700}
p{margin:0;font-size:17px;line-height:1.45;opacity:.85}
a.stop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:14px 16px;min-height:64px;background:rgba(150,6,12,.92);color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);font-size:24px;font-weight:700;position:relative}
a.stop::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;background:var(--ink);clip-path:polygon(0 0,100% 0,0 100%)}
a.stop small{display:block;font-size:14px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
a.stop:hover{background:rgba(176,10,18,.95)}
a.stop:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
code{font-size:14px;color:var(--bone);opacity:.9}
</style>
</head><body>
<main>
  <span class="eyebrow">The Cape of No Hope</span>
  <h1>Test the stops</h1>
  <p>Each game opens at its own address, so each QR code can point straight at its stop.</p>
  <a class="stop" href="pump/"><span><small>Prince Street</small>The Hurling Pump</span><span aria-hidden="true">&rarr;</span></a>
  <a class="stop" href="mannenberg/"><span><small>Bloem Street</small>The Mannenberg Pipes</span><span aria-hidden="true">&rarr;</span></a>
  <p><code>/pump/</code> &middot; <code>/mannenberg/</code></p>
</main>

</body></html>
